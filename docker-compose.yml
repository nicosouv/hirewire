services:
  postgres:
    image: postgres:17-alpine
    container_name: hirewire_postgres
    environment:
      POSTGRES_DB: hirewire
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      TZ: Europe/Paris
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/postgres:/docker-entrypoint-initdb.d
    networks:
      - hirewire_network

  duckdb_init:
    build:
      context: .
      dockerfile: .infra/docker/duckdb.Dockerfile
    container_name: hirewire_duckdb_init
    volumes:
      - duckdb_data:/data
      - ./data:/data-local
      - ./sql/duckdb:/sql/duckdb
      - ./scripts:/scripts
    networks:
      - hirewire_network
    command: >
      sh -c "
        /scripts/setup/init_duckdb.sh;
        echo 'DuckDB initialization completed. Container will exit.';
      "
    restart: "no"
    profiles:
      - init

  dbt:
    build:
      context: .
      dockerfile: .infra/docker/dbt.Dockerfile
    container_name: hirewire_dbt
    platform: linux/amd64
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
    volumes:
      - ./dbt_project:/usr/app
      - ./profiles:/root/.dbt
      - ./data:/data
      - duckdb_data:/data
    networks:
      - hirewire_network
    depends_on:
      - postgres
    entrypoint: ["/bin/sh", "-c"]
    command: ["while true; do sleep 30; done"]

  # FastAPI Backend
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: hirewire_api
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/app:/app/app
    networks:
      - hirewire_network
    depends_on:
      - postgres
    restart: unless-stopped

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: hirewire_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - hirewire_network
    depends_on:
      - api
    environment:
      - VITE_API_URL=http://localhost:8000
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: hirewire_redis
    networks:
      - hirewire_network
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  superset:
    build:
      context: .
      dockerfile: .infra/docker/superset.Dockerfile
    container_name: hirewire_superset
    platform: linux/amd64
    ports:
      - "8088:8088"
    environment:
      DATABASE_URL: postgresql://superset:superset@postgres:5432/superset
      REDIS_HOST: redis
      SUPERSET_SECRET_KEY:  ${SUPERSET_SECRET_KEY:-your-secret-key-change-in-production}
    depends_on:
      - postgres
      - redis
    networks:
      - hirewire_network
    volumes:
      - superset_data:/app/superset_home
      - ./data:/app/duckdb-data
    healthcheck:
      test: curl --fail http://localhost:8088/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
    profiles:
      - superset

  # Airflow 3.x services
  airflow-postgres:
    image: postgres:17-alpine
    container_name: hirewire_airflow_postgres
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_POSTGRES_PASSWORD:-airflow}
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    networks:
      - hirewire_network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-init:
    build:
      context: .
      dockerfile: .infra/docker/airflow.Dockerfile
    container_name: hirewire_airflow_init
    environment:
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_POSTGRES_PASSWORD:-airflow}@airflow-postgres:5432/airflow
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:${AIRFLOW_POSTGRES_PASSWORD:-airflow}@airflow-postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLbfzqDDho=}
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__API__AUTH_BACKEND: 'airflow.api.auth.backend.basic_auth'
      AIRFLOW_UID: 50000
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_USERNAME:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_PASSWORD:-admin}
    depends_on:
      airflow-postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - hirewire_network
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/create_admin_user.py:/opt/airflow/create_admin_user.py
      - ./dbt_project:/opt/airflow/dbt_project
      - ./scripts:/opt/airflow/scripts
      - duckdb_data:/data
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate

        # Create admin user with fixed credentials
        airflow users create \
          --username ${AIRFLOW_USERNAME:-admin} \
          --password ${AIRFLOW_PASSWORD:-admin} \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@hirewire.com || echo "User already exists"

        echo "✅ Airflow initialization completed"
        echo "👤 Admin credentials: ${AIRFLOW_USERNAME:-admin} / ${AIRFLOW_PASSWORD:-admin}"
    restart: "no"
    profiles:
      - airflow

  airflow-webserver:
    build:
      context: .
      dockerfile: .infra/docker/airflow.Dockerfile
    container_name: hirewire_airflow_webserver
    environment:
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-webserver:8080/execution/'
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_FERNET_KEY:-46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLbfzqDDho=}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_POSTGRES_PASSWORD:-airflow}@airflow-postgres:5432/airflow
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:${AIRFLOW_POSTGRES_PASSWORD:-airflow}@airflow-postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLbfzqDDho=}
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__API__AUTH_BACKEND: 'airflow.api.auth.backend.basic_auth'
      AIRFLOW__EMAIL__EMAIL_BACKEND: 'airflow.providers.standard.notifications.null.NullNotifier'
      AIRFLOW_UID: 50000
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    depends_on:
      - airflow-init
      - airflow-postgres
      - redis
      - postgres
    networks:
      - hirewire_network
    ports:
      - "8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./dbt_project:/opt/airflow/dbt_project
      - ./scripts:/opt/airflow/scripts
      - duckdb_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    command: api-server
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/api/v2/monitor/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    profiles:
      - airflow

  airflow-scheduler:
    build:
      context: .
      dockerfile: .infra/docker/airflow.Dockerfile
    container_name: hirewire_airflow_scheduler
    environment:
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-webserver:8080/execution/'
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_FERNET_KEY:-46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLbfzqDDho=}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_POSTGRES_PASSWORD:-airflow}@airflow-postgres:5432/airflow
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:${AIRFLOW_POSTGRES_PASSWORD:-airflow}@airflow-postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLbfzqDDho=}
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__DAG_DISCOVERY_SAFE_MODE: 'false'
      AIRFLOW__API__AUTH_BACKEND: 'airflow.api.auth.backend.basic_auth'
      AIRFLOW__EMAIL__EMAIL_BACKEND: 'airflow.providers.standard.notifications.null.NullNotifier'
      AIRFLOW_UID: 50000
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    depends_on:
      - airflow-init
      - airflow-postgres
      - redis
      - postgres
    networks:
      - hirewire_network
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./dbt_project:/opt/airflow/dbt_project
      - ./scripts:/opt/airflow/scripts
      - duckdb_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    profiles:
      - airflow

  airflow-worker:
    build:
      context: .
      dockerfile: .infra/docker/airflow.Dockerfile
    container_name: hirewire_airflow_worker
    environment:
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-webserver:8080/execution/'
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_FERNET_KEY:-46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLbfzqDDho=}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_POSTGRES_PASSWORD:-airflow}@airflow-postgres:5432/airflow
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:${AIRFLOW_POSTGRES_PASSWORD:-airflow}@airflow-postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLbfzqDDho=}
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__API__AUTH_BACKEND: 'airflow.api.auth.backend.basic_auth'
      AIRFLOW__EMAIL__EMAIL_BACKEND: 'airflow.providers.standard.notifications.null.NullNotifier'
      AIRFLOW_UID: 50000
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    depends_on:
      - airflow-init
      - airflow-postgres
      - redis
      - postgres
    networks:
      - hirewire_network
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./dbt_project:/opt/airflow/dbt_project
      - ./scripts:/opt/airflow/scripts
      - duckdb_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    command: celery worker
    healthcheck:
      test:
        - "CMD-SHELL"
        - 'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}" || celery --app airflow.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"'
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    profiles:
      - airflow

  # Nginx reverse proxy for Airflow with JWT authentication
  nginx-airflow:
    build:
      context: .
      dockerfile: .infra/docker/nginx-airflow.Dockerfile
    container_name: hirewire_nginx_airflow
    ports:
      - "8081:8081"
    depends_on:
      - airflow-webserver
      - api
    networks:
      - hirewire_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    profiles:
      - airflow

volumes:
  postgres_data:
  duckdb_data:
  redis_data:
  superset_data:
  airflow_postgres_data:

networks:
  hirewire_network:
    driver: bridge