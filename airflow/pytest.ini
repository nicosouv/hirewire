[pytest]
# Pytest configuration for Airflow DAG tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes

# Markers
markers =
    integration: Integration tests (may require running services)
    unit: Unit tests (fast, no external dependencies)
    slow: Slow running tests

# Ignore paths
norecursedirs =
    .git
    __pycache__
    logs
    plugins

# Coverage options (optional)
[coverage:run]
source = dags
omit =
    */tests/*
    */__pycache__/*
    */logs/*

[coverage:report]
precision = 2
show_missing = True
