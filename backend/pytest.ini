[pytest]
# Pytest configuration for FastAPI backend tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    --asyncio-mode=auto

# Markers
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (requires database)
    api: API endpoint tests
    slow: Slow running tests
    auth: Authentication/authorization tests

# Async mode
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Ignore paths
norecursedirs =
    .git
    __pycache__
    .pytest_cache
    venv
    env
    build
    dist

# Coverage options
[coverage:run]
source = app
omit =
    */tests/*
    */__pycache__/*
    */venv/*
    */env/*
    */.venv/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
