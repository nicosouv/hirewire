upstream fastapi_backend {
    server api:8000;
}

upstream airflow_backend {
    server airflow-webserver:8080;
}

# Cache for auth responses (reduce load on FastAPI)
proxy_cache_path /tmp/nginx_auth_cache levels=1:2 keys_zone=auth_cache:10m max_size=100m inactive=60m;

server {
    listen 8081;
    server_name localhost;

    # Increase buffer sizes for Airflow
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # Location for Airflow UI
    location / {
        # Step 1: Check for JWT token in Authorization header or Cookie
        set $auth_token "";

        # Try Authorization header first
        if ($http_authorization ~* "Bearer (.+)") {
            set $auth_token $1;
        }

        # Try cookie if no header
        if ($auth_token = "") {
            set $auth_token $cookie_access_token;
        }

        # Step 2: If no token, redirect to login
        if ($auth_token = "") {
            return 302 http://localhost:5173/login?next=http://localhost:8081$request_uri;
        }

        # Step 3: Validate token and Airflow admin access with FastAPI backend
        # The /airflow/validate endpoint returns:
        # - 200 OK if user is authenticated and is_airflow_admin = true
        # - 403 Forbidden if user is authenticated but is_airflow_admin = false
        # - 401 Unauthorized if token is invalid
        auth_request /auth/validate;

        # Step 4: Forward to Airflow
        proxy_pass http://airflow_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for Airflow live logs
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # Internal location for JWT validation
    location = /auth/validate {
        internal;

        # Call FastAPI to validate the token
        proxy_pass http://fastapi_backend/api/v1/airflow/validate;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization "Bearer $auth_token";
        proxy_set_header X-Original-URI $request_uri;

        # Cache successful validations for 1 minute
        proxy_cache auth_cache;
        proxy_cache_valid 200 1m;
        proxy_cache_key "$auth_token";
    }

    # Health check endpoint (no auth required)
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Proxy static files directly (no auth needed after initial auth)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://airflow_backend;
        proxy_set_header Host $host;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }
}
